<svg width="680" height="600" viewBox="0 0 680 600" xmlns="http://www.w3.org/2000/svg" font-family="'Fira Code', 'Courier New', monospace">
  <defs>
    <style>
      .text-base { font-size: 13px; line-height: 1.5; }
      .text-muted { fill: #8b949e; }
      .text-title { font-size: 18px; font-weight: bold; fill: #e6edf3; text-anchor: middle; }
      .tag { font-size: 11px; text-anchor: middle; }
      .badge { font-size: 10px; font-weight: bold; text-anchor: middle; fill: white; }
    </style>
  </defs>
  
  <rect width="680" height="600" rx="12" fill="#0d1117"/>

  <text x="340" y="40" text-anchor="middle" fill="#7C3AED" font-size="24" font-weight="bold">🎵 Proyectos Destacados</text>

  <rect x="20" y="70" width="640" height="230" rx="10" fill="#161b22" stroke="#21262d" stroke-width="1.2"/>

  <text x="340" y="105" class="text-title">🎬 BeatSound</text>
  
  <rect x="250" y="115" width="40" height="20" rx="10" fill="#7C3AED"/>
  <text x="270" y="129" class="badge">TFG</text>
  
  <rect x="300" y="115" width="110" height="20" rx="10" fill="#1f6feb"/>
  <text x="355" y="129" class="badge">EN DESARROLLO</text>

  <line x1="44" y1="145" x2="636" y2="145" stroke="#21262d" stroke-width="1"/>

  <text x="44" y="170" class="text-base text-muted">App móvil de scroll de vídeos para dar visibilidad a artistas emergentes.</text>
  <text x="44" y="190" class="text-base text-muted">Nació como TFG y sigue creciendo con el objetivo de lanzarse al público.</text>
  <text x="44" y="210" class="text-base text-muted">Feed vertical de contenido, perfiles de artista y sistema de descubrimiento.</text>

  <g transform="translate(0, 30)">
    <rect x="44" y="195" width="52" height="22" rx="11" fill="none" stroke="#ED8B00" stroke-width="1.2"/>
    <text x="70" y="210" class="tag" fill="#ED8B00">Spring Boot</text>

    <rect x="110" y="195" width="94" height="22" rx="11" fill="none" stroke="#3DDC84" stroke-width="1.2"/>
    <text x="157" y="210" class="tag" fill="#3DDC84">Android Studio</text>

    <rect x="218" y="195" width="50" height="22" rx="11" fill="none" stroke="#6DB33F" stroke-width="1.2"/>
    <text x="243" y="210" class="tag" fill="#6DB33F">VS Code</text>

    <rect x="282" y="195" width="40" height="22" rx="11" fill="none" stroke="#ED8B00" stroke-width="1.2"/>
    <text x="302" y="210" class="tag" fill="#ED8B00">Java</text>

    <rect x="336" y="195" width="58" height="22" rx="11" fill="none" stroke="#4ea94b" stroke-width="1.2"/>
    <text x="365" y="210" class="tag" fill="#4ea94b">Flutter</text>

    <rect x="408" y="195" width="60" height="22" rx="11" fill="none" stroke="#7C3AED" stroke-width="1.2"/>
    <text x="438" y="210" class="tag" fill="#a78bfa">REST API</text>

    <rect x="482" y="195" width="54" height="22" rx="11" fill="none" stroke="#0db7ed" stroke-width="1.2"/>
    <text x="509" y="210" class="tag" fill="#0db7ed">Docker</text>
  </g>

  <rect x="20" y="320" width="640" height="230" rx="10" fill="#161b22" stroke="#21262d" stroke-width="1.2"/>

  <text x="340" y="355" class="text-title">📼 MIXTAPE</text>
  
  <rect x="280" y="365" width="108" height="20" rx="10" fill="#b08800"/>
  <text x="334" y="379" class="badge">PRÓXIMAMENTE</text>

  <line x1="44" y1="395" x2="636" y2="395" stroke="#21262d" stroke-width="1"/>

  <text x="44" y="420" class="text-base text-muted">Foro web con estética dosmilera para compartir playlists en tiempo real.</text>
  <text x="44" y="440" class="text-base text-muted">Conecta con amigos, descubre música nueva y conversa sobre tus canciones</text>
  <text x="44" y="460" class="text-base text-muted">favoritas en una comunidad con todo el sabor de los 2000.</text>

  <g transform="translate(0, 30)">
    <rect x="44" y="445" width="94" height="22" rx="11" fill="none" stroke="#F7DF1E" stroke-width="1.2"/>
    <text x="91" y="460" class="tag" fill="#F7DF1E">JavaScript</text>

    <rect x="152" y="445" width="50" height="22" rx="11" fill="none" stroke="#E34F26" stroke-width="1.2"/>
    <text x="177" y="460" class="tag" fill="#E34F26">HTML5</text>

    <rect x="216" y="445" width="42" height="22" rx="11" fill="none" stroke="#1572B6" stroke-width="1.2"/>
    <text x="237" y="460" class="tag" fill="#1572B6">CSS3</text>
  </g>

  <text x="340" y="580" text-anchor="middle" fill="#50565d" font-size="11" font-style="italic">"El código limpio siempre parece que ha sido escrito por alguien a quien le importa." — Michael Feathers</text>
</svg>
