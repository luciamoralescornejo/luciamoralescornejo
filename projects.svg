<svg width="680" height="560" viewBox="0 0 680 560" xmlns="http://www.w3.org/2000/svg" font-family="'Fira Code', 'Courier New', monospace">
  <rect width="680" height="560" rx="12" fill="#0d1117"/>

  <!-- Título -->
  <text x="340" y="48" text-anchor="middle" fill="#7C3AED" font-size="22" font-weight="bold">🎵 Proyectos Destacados</text>

  <!-- ── PROYECTO 1: BeatSound ── -->
  <rect x="20" y="68" width="640" height="210" rx="10" fill="#161b22" stroke="#21262d" stroke-width="1.2"/>

  <text x="44" y="102" fill="#e6edf3" font-size="16" font-weight="bold">🎬 BeatSound</text>
  <!-- Badge TFG -->
  <rect x="152" y="86" width="40" height="20" rx="10" fill="#7C3AED"/>
  <text x="172" y="100" text-anchor="middle" fill="white" font-size="10" font-weight="bold">TFG</text>
  <!-- Badge EN DESARROLLO -->
  <rect x="200" y="86" width="110" height="20" rx="10" fill="#1f6feb"/>
  <text x="255" y="100" text-anchor="middle" fill="white" font-size="10" font-weight="bold">EN DESARROLLO</text>

  <line x1="44" y1="112" x2="636" y2="112" stroke="#21262d" stroke-width="1"/>

  <text x="44" y="135" fill="#8b949e" font-size="12">App móvil de scroll de vídeos para dar visibilidad a artistas emergentes.</text>
  <text x="44" y="153" fill="#8b949e" font-size="12">Nació como TFG y sigue creciendo con el objetivo de lanzarse al público.</text>
  <text x="44" y="171" fill="#8b949e" font-size="12">Feed vertical de contenido, perfiles de artista y sistema de descubrimiento.</text>

  <!-- Tags fila 1 -->
  <rect x="44" y="185" width="52" height="20" rx="10" fill="none" stroke="#ED8B00" stroke-width="1.2"/>
  <text x="70" y="199" text-anchor="middle" fill="#ED8B00" font-size="11">Kotlin</text>

  <rect x="104" y="185" width="90" height="20" rx="10" fill="none" stroke="#3DDC84" stroke-width="1.2"/>
  <text x="149" y="199" text-anchor="middle" fill="#3DDC84" font-size="11">Android Studio</text>

  <rect x="202" y="185" width="48" height="20" rx="10" fill="none" stroke="#6DB33F" stroke-width="1.2"/>
  <text x="226" y="199" text-anchor="middle" fill="#6DB33F" font-size="11">Spring</text>

  <rect x="258" y="185" width="40" height="20" rx="10" fill="none" stroke="#ED8B00" stroke-width="1.2"/>
  <text x="278" y="199" text-anchor="middle" fill="#ED8B00" font-size="11">Java</text>

  <rect x="306" y="185" width="56" height="20" rx="10" fill="none" stroke="#4ea94b" stroke-width="1.2"/>
  <text x="334" y="199" text-anchor="middle" fill="#4ea94b" font-size="11">MongoDB</text>

  <rect x="370" y="185" width="54" height="20" rx="10" fill="none" stroke="#7C3AED" stroke-width="1.2"/>
  <text x="397" y="199" text-anchor="middle" fill="#a78bfa" font-size="11">REST API</text>

  <rect x="432" y="185" width="54" height="20" rx="10" fill="none" stroke="#0db7ed" stroke-width="1.2"/>
  <text x="459" y="199" text-anchor="middle" fill="#0db7ed" font-size="11">Docker</text>

  <!-- ── PROYECTO 2: MIXTAPE ── -->
  <rect x="20" y="298" width="640" height="210" rx="10" fill="#161b22" stroke="#21262d" stroke-width="1.2"/>

  <text x="44" y="332" fill="#e6edf3" font-size="16" font-weight="bold">📼 MIXTAPE</text>
  <!-- Badge PRÓXIMAMENTE -->
  <rect x="134" y="316" width="108" height="20" rx="10" fill="#b08800"/>
  <text x="188" y="330" text-anchor="middle" fill="white" font-size="10" font-weight="bold">PRÓXIMAMENTE</text>

  <line x1="44" y1="342" x2="636" y2="342" stroke="#21262d" stroke-width="1"/>

  <text x="44" y="365" fill="#8b949e" font-size="12">Foro web con estética dosmilera para compartir playlists en tiempo real.</text>
  <text x="44" y="383" fill="#8b949e" font-size="12">Conecta con amigos, descubre música nueva y conversa sobre tus canciones</text>
  <text x="44" y="401" fill="#8b949e" font-size="12">favoritas en una comunidad con todo el sabor de los 2000.</text>

  <!-- Tags -->
  <rect x="44" y="415" width="94" height="20" rx="10" fill="none" stroke="#F7DF1E" stroke-width="1.2"/>
  <text x="91" y="429" text-anchor="middle" fill="#F7DF1E" font-size="11">JavaScript</text>

  <rect x="146" y="415" width="50" height="20" rx="10" fill="none" stroke="#E34F26" stroke-width="1.2"/>
  <text x="171" y="429" text-anchor="middle" fill="#E34F26" font-size="11">HTML5</text>

  <rect x="204" y="415" width="42" height="20" rx="10" fill="none" stroke="#1572B6" stroke-width="1.2"/>
  <text x="225" y="429" text-anchor="middle" fill="#1572B6" font-size="11">CSS3</text>

  <rect x="254" y="415" width="42" height="20" rx="10" fill="none" stroke="#ED8B00" stroke-width="1.2"/>
  <text x="275" y="429" text-anchor="middle" fill="#ED8B00" font-size="11">Java</text>

  <rect x="304" y="415" width="48" height="20" rx="10" fill="none" stroke="#6DB33F" stroke-width="1.2"/>
  <text x="328" y="429" text-anchor="middle" fill="#6DB33F" font-size="11">Spring</text>

  <rect x="360" y="415" width="50" height="20" rx="10" fill="none" stroke="#00f" stroke-width="1.2"/>
  <text x="385" y="429" text-anchor="middle" fill="#6699ff" font-size="11">MySQL</text>

  <rect x="418" y="415" width="76" height="20" rx="10" fill="none" stroke="#7C3AED" stroke-width="1.2"/>
  <text x="456" y="429" text-anchor="middle" fill="#a78bfa" font-size="11">WebSockets</text>

  <!-- Cita footer -->
  <text x="340" y="528" text-anchor="middle" fill="#30363d" font-size="11" font-style="italic">"El código limpio siempre parece que ha sido escrito por alguien a quien le importa." — Michael Feathers</text>
</svg>
